services:
  node1:
    build: .
    container_name: forgechain-node1
    command: ["--port", "9000", "--mine-every", "10"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    networks:
      forgechain-net:
        ipv4_address: 172.28.0.11

  node2:
    build: .
    container_name: forgechain-node2
    command: ["--port", "9000", "--connect", "172.28.0.11", "9000", "--mine-every", "0"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    depends_on:
      node1:
        condition: service_healthy
    networks:
      forgechain-net:
        ipv4_address: 172.28.0.12

  node3:
    build: .
    container_name: forgechain-node3
    command: ["--port", "9000", "--connect", "172.28.0.12", "9000", "--mine-every", "0"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    depends_on:
      node2:
        condition: service_healthy
    networks:
      forgechain-net:
        ipv4_address: 172.28.0.13

  node4:
    build: .
    container_name: forgechain-node4
    command: ["--port", "9000", "--connect", "172.28.0.13", "9000", "--mine-every", "0"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    depends_on:
      node3:
        condition: service_healthy
    networks:
      forgechain-net:
        ipv4_address: 172.28.0.14

networks:
  forgechain-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
